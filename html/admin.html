    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f7fa;
        }

        header{
            background:#1e3a5f;
            color:white;
            padding:25px 60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        header h1{
            font-size:30px;
        }

        .container{
            width:90%;
            max-width:1200px;
            margin:50px auto;
        }

        .container h2{
            color:#333;
            margin-bottom:30px;
        }

        .card-container{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:30px;
        }

        .card{
            background:white;
            padding:35px;
            border-radius:15px;
            text-align:center;
            box-shadow:0 5px 15px rgba(0,0,0,.1);
            transition:.3s;
        }

        .card:hover{
            transform:translateY(-8px);
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .card i{
            font-size:50px;
            color:#48cae4;
            margin-bottom:20px;
        }

        .card h3{
            margin-bottom:15px;
            color:#222;
        }

        .card p{
            color:#666;
            margin-bottom:25px;
        }

        .btn{
            display:inline-block;
            background:#48cae4;
            color:white;
            text-decoration:none;
            padding:12px 25px;
            border-radius:8px;
            transition:.3s;
        }

        .btn:hover{
            background:#0096c7;
        }
    </style>
</head>
